name: teacher_control
description: كنترول المدرس - Teacher Control
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  intl: any

  # قاعدة البيانات (SQLite) - نفسها المستخدمة في وحدة الجرس
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  file_picker: ^8.1.2

  # للمراحل القادمة (تصدير/مشاركة)
  share_plus: ^10.1.4
  pdf: ^3.11.0
  printing: ^5.12.0
  excel: ^4.0.6

  # صفحة المطور
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
    - family: Mohammad Bold
      fonts:
        - asset: assets/fonts/Mohammad_Bold_normal.ttf
    - family: Mohammad Head
      fonts:
        - asset: assets/fonts/Mohammad_Head.ttf
